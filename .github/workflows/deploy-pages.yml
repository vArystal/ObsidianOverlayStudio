name: Deploy Overlay Studio to GitHub Pages

on:
  push:
    branches:
      - main
      - arena/35be064d-jubilant-octo-lamp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Verify published assets and rendered application
        run: |
          set -euo pipefail
          cache_bust="?version=${GITHUB_SHA}"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${PAGE_URL}${cache_bust}" --output page.html
          grep -q 'id="root"' page.html
          asset_path=$(grep -oE 'src="\./assets/[^"]+\.js"' page.html | head -1 | cut -d'"' -f2 | sed 's#^\./##')
          test -n "$asset_path"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${PAGE_URL}${asset_path}" --output app.js
          google-chrome --headless --disable-gpu --no-sandbox --virtual-time-budget=8000 \
            --enable-logging=stderr --dump-dom "${PAGE_URL}${cache_bust}#/overlays" > rendered.html 2> browser-console.log
          grep -q 'Your overlays' rendered.html
          google-chrome --headless --disable-gpu --no-sandbox --virtual-time-budget=8000 \
            --enable-logging=stderr --dump-dom "${PAGE_URL}${cache_bust}#/integrations" > integrations.html 2>> browser-console.log
          grep -q 'Live integrations' integrations.html
          grep -q 'Donation provider' integrations.html
          ! grep -E 'Uncaught|TypeError|ReferenceError|Minified React error' browser-console.log
